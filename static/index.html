<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ZenStats">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>ZenStats</title>

<style>
:root{color-scheme:dark}
body{margin:0;background:#000;color:#f4f5fb;font:13px system-ui,sans-serif}
*{box-sizing:border-box}
main{max-width:780px;margin:auto;padding:20px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:20px}
button,input{font:inherit;color:inherit;background:#242e40;border:1px solid #3d4a60;border-radius:18px;padding:7px 11px}
button{cursor:pointer}
button[aria-pressed=true]{background:#f4f5fb;color:#161b27}
h2{font-size:15px;margin:16px 0 10px}
h3{font-size:13px;margin:12px 0}
.muted{font-size:11px;color:#afbdd1}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.group{background:#1b2535;padding:12px;border-radius:11px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:#283348;border:0;border-radius:8px;padding:12px;text-align:left;width:100%}
.identity{display:flex;gap:9px;align-items:center;margin-bottom:8px}
img{width:36px;height:36px;object-fit:cover;border-radius:50%;background:#35435a}
.green{color:#97ff42}
.red{color:#ff738b}
details{background:#1d283b;border:1px solid #3c4b63;border-radius:10px;padding:12px;margin:9px 0}
summary{list-style:none;cursor:pointer}
summary::after{content:"⌄";float:right}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:15px 0}
.metric{background:#2b374c;border-radius:7px;padding:11px;text-align:center}
.metric strong{display:block;margin-top:5px}
.plot{position:relative;height:220px;padding:25px 4px 40px;margin:20px 0 8px}
.bars{height:100%;display:flex;gap:5px;align-items:end;background:repeating-linear-gradient(to top,transparent 0,transparent 37px,#ffffff15 38px)}
.column{position:relative;flex:1;height:100%;display:flex;align-items:end;min-width:0}
.bar{width:100%;position:relative;min-height:2px}
.number{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:11px;font-weight:500}
.opponent{position:absolute;top:100%;left:0;right:0;padding-top:7px;text-align:center;font-size:10px;color:#b2bed2;line-height:13px}
.game-date{display:block;font-size:8px;white-space:nowrap;color:#afbdd1}
.average{position:absolute;left:4px;right:4px;border-top:2px solid white;pointer-events:none}
.average span{position:absolute;right:0;bottom:0;font-size:11px;background:#1d283b}
.actions{display:flex;gap:8px}
.actions button{flex:1;border-radius:6px;background:#20834e;border-color:#61d897;color:white}
.actions button:last-child{background:#bc3f57;border-color:#ff7e97}
.actions button[aria-pressed=true]{box-shadow:inset 0 0 0 2px white}
#search{width:100%;border-radius:8px;margin-top:14px}
#nav{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
#nav button{white-space:nowrap;flex-shrink:0}
.box-hit{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;border-radius:0;background:transparent;z-index:2;min-height:0}
.box-hit:focus-visible{outline:2px solid #fff;outline-offset:2px}
#box-dialog{background:#1d283b;color:#f4f5fb;border:1px solid #3c4b63;border-radius:12px;width:min(94vw,520px);max-height:85dvh;overflow:auto;padding:16px}
#box-dialog::backdrop{background:#000b}
.box-table{width:100%;border-collapse:collapse;margin-top:12px}
.box-table th,.box-table td{text-align:left;padding:8px;border-bottom:1px solid #ffffff20}
.box-table td{text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:480px){
main{padding-left:12px;padding-right:12px}
.tile{padding:9px}
.identity{flex-wrap:wrap}
.bars{gap:3px}
}
@media(pointer:coarse){
button,summary{min-height:44px}
.box-hit{min-height:0}
input{font-size:16px}
}
</style>
</head>

<body>
<main>
<header>
  <strong><span class="green">▥</span> ZenStats</strong>
  <button id="picks">My Picks (0)</button>
</header>

<h2>Today's Games</h2>
<p id="status" class="muted" role="status">Loading saved NBA data…</p>
<nav id="nav" class="row" aria-label="Games"></nav>
<input id="search" type="search" placeholder="Search players…" aria-label="Search players">
<p id="save-status" class="muted" role="status" hidden></p>
<div id="content"></div>

<dialog id="box-dialog" aria-labelledby="box-title">
  <div class="row" style="justify-content:space-between">
    <h2 id="box-title">Player box score</h2>
    <button data-close-box>Close</button>
  </div>
  <div id="box-content"></div>
</dialog>
</main>

<script>
(() => {
  const q = selector => document.querySelector(selector);
  const cats = ["PTS","REB","AST","3PM","PR","PA","RA","PRA","STL","BLK"];

  let data = {players:[],games:[]};
  let game = "all";
  let team = "All";
  let stat = "PTS";
  let n = 5;
  let venue = "All";
  let minutes = false;
  let search = "";
  let myPicks = false;
  let picks = [];

  const storageKey = "nba-prop-tracker-picks-v1";

  const esc = value => String(value ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

  function storageMessage() {
    q("#save-status").hidden = false;
    q("#save-status").textContent =
      "Picks could not be saved on this device. " +
      "They will last for this session only.";
  }

  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");

    if (Array.isArray(saved)) {
      picks = saved.filter(p =>
        Number.isInteger(p.id) &&
        typeof p.name === "string" &&
        cats.includes(p.stat) &&
        ["Over","Under"].includes(p.side) &&
        Number.isFinite(p.average)
      );
    }
  } catch (error) {
    storageMessage();
  }

  function save() {
    try {
      localStorage.setItem(storageKey,JSON.stringify(picks));
    } catch (error) {
      storageMessage();
    }
  }

  function val(log,key) {
    const combinations = {
      PR:["PTS","REB"],
      PA:["PTS","AST"],
      RA:["REB","AST"],
      PRA:["PTS","REB","AST"]
    };

    const fields = combinations[key] || [key];

    return fields.every(f =>
      typeof log[f] === "number" && Number.isFinite(log[f])
    )
      ? fields.reduce((sum,f) => sum + log[f],0)
      : null;
  }

  function avg(player,key) {
    const values = player.logs
      .map(log => val(log,key))
      .filter(v => v !== null);

    return values.length
      ? values.reduce((a,b) => a+b,0)/values.length
      : null;
  }

  const fmt = v => v === null ? "—" : v.toFixed(1);

  const chosen = (player,key) => player.logs.filter(log =>
    (venue === "All" || log.home === (venue === "Home")) &&
    val(log,key) !== null
  ).slice(0,n);

  const matches = player =>
    player.name.toLowerCase().includes(search.trim().toLowerCase());

  const selected = (id,side) => picks.some(p =>
    p.id === id && p.stat === stat && p.side === side
  );

  function identity(player) {
    player = {
      ...player,
      ...(data.players.find(p => p.id === player.id) || {})
    };

    const bio = [
      player.position,
      player.height,
      player.weight
    ].filter(Boolean).join(" · ");

    const url = player.id < 0
      ? `https://a.espncdn.com/i/headshots/nba/players/full/${Math.abs(player.id)}.png`
      : `https://cdn.nba.com/headshots/nba/latest/260x190/${player.id}.png`;

    return `
      <span class="identity">
        <img src="${url}" alt="${esc(player.name)}" loading="lazy">
        <span>
          <span class="muted">${esc(player.team)}</span><br>
          <strong>${esc(player.name)}</strong>
          ${bio ? `<br><span class="muted">${esc(bio)}</span>` : ""}
        </span>
      </span>
    `;
  }

  function trend(player) {
    const a = avg(player,stat);
    const games = player.logs.filter(g => val(g,stat) !== null).slice(0,n);

    if (a === null) {
      return '<span class="muted">No saved history</span>';
    }

    const above = games.filter(g => val(g,stat) > a+1e-9).length;
    const below = games.filter(g => val(g,stat) < a-1e-9).length;

    if (above === below) {
      return `<span class="muted">Above / Below tied · ${above}/${games.length} each</span>`;
    }

    return `
      <span class="${above>below?"green":"red"}">
        ${above>below?"Above":"Below"} ${Math.max(above,below)}/${games.length}
      </span>
    `;
  }

  function showBox(player,log) {
    const number = v => Number.isFinite(v) ? String(v) : "—";
    const pair = (made,attempted) => number(made)+" / "+number(attempted);

    const rows = [
      ["Minutes",Number.isFinite(log.MIN)?log.MIN.toFixed(1):"—"],
      ["Points",number(log.PTS)],
      ["Rebounds",number(log.REB)],
      ["Assists",number(log.AST)],
      ["3PT made / attempted",pair(log["3PM"],log["3PA"])],
      ["Steals",number(log.STL)],
      ["Blocks",number(log.BLK)],
      ["Turnovers",number(log.TOV)],
      ["FG made / attempted",pair(log.FGM,log.FGA)],
      ["FT made / attempted",pair(log.FTM,log.FTA)],
      ["Personal fouls",number(log.PF)],
      ["Offensive rebounds",number(log.OREB)],
      ["Defensive rebounds",number(log.DREB)]
    ];

    const matchup = log.away_team && log.home_team
      ? log.away_team+" @ "+log.home_team
      : (log.home?"Home vs ":"Away at ")+log.opp;

    q("#box-title").textContent = player.name+" · Box Score";

    q("#box-content").innerHTML = identity(player) + `
      <p class="muted">${esc(log.date)} · ${esc(matchup)}</p>
      <table class="box-table">
        <thead>
          <tr>
            <th scope="col">Stat</th>
            <th scope="col" style="text-align:right">Total</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(([label,value]) => `
            <tr>
              <th scope="row">${label}</th>
              <td>${value}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
      <p class="muted">— means unavailable in the saved data.</p>
    `;

    q("#box-dialog").showModal();
  }

  function gameDate(value) {
    const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(value || ""));

    return match
      ? `${Number(match[2])}/${Number(match[3])}`
      : "";
  }

  function chart(player) {
    const key = minutes?"MIN":stat;
    const a = avg(player,key);
    const games = chosen(player,key).slice().reverse();

    if (!games.length) {
      return '<p class="muted">No saved games for this selection.</p>';
    }

    const max = Math.max(
      1,a,...games.map(g =>
        key==="3PM"?Math.max(g["3PA"]??0,g[key]):val(g,key)
      )
    )*1.2;

    const bars = games.map((log,index) => {
      const v = val(log,key);
      const attempts = key==="3PM" && Number.isFinite(log["3PA"])
        ? `
          <div style="
            position:absolute;bottom:0;width:100%;
            height:${100*log["3PA"]/max}%;background:#596982;
          ">
            <span class="number" style="color:#bbc8dd">${log["3PA"]}</span>
          </div>
        `
        : "";

      const color = v>a+1e-9?"#97ff42":v<a-1e-9?"#ff667e":"#efd16a";

      return `
        <div class="column">
          <button
            class="box-hit"
            data-box="${player.id}:${player.logs.indexOf(log)}"
            aria-label="${esc(player.name)} game box score, ${esc(log.date)}, ${esc(log.opp)}, ${v} ${esc(key)}"
          ></button>
          ${attempts}
          <div class="bar" style="
            height:${100*v/max}%;
            ${key==="3PM"?"width:62%;margin:auto auto 0;":""}
            background:${color};
          ">
            <span class="number">${v}</span>
          </div>
          <span class="opponent">
            ${games.length<=10?esc(log.opp):index+1}
            <span class="game-date">${gameDate(log.date)}</span>
          </span>
        </div>
      `;
    }).join("");

    return `
      <div class="plot" role="group" aria-label="Recent ${esc(key)}. Select a bar for its game box score.">
        <div class="bars">${bars}</div>
        <div class="average" style="bottom:calc(40px + 155px * ${a/max});">
          <span>AVG ${fmt(a)}</span>
        </div>
      </div>
      <p class="muted">
        ${key==="3PM"?"Muted background: attempted · Colored bar: made<br>":""}
        Green: above · Red: below · Yellow: equal · White: season average
      </p>
      ${key==="3PM" && games.some(g => g["3PA"]===null)
        ? '<p class="muted">Attempts unavailable for some games; no attempts bar is shown for those games.</p>'
        : ""}
    `;
  }

  function detail(player) {
    const key = minutes?"MIN":stat;
    const games = chosen(player,key);
    const a = avg(player,stat);
    const recent = games.length
      ? fmt(games.reduce((s,g) => s+val(g,key),0)/games.length)
      : "—";

    return `
      <details data-player="${player.id}">
        <summary>
          ${identity(player)}
          <span class="muted">
            PTS ${fmt(avg(player,"PTS"))} · REB ${fmt(avg(player,"REB"))} · AST ${fmt(avg(player,"AST"))}
          </span>
        </summary>

        <div class="row" style="margin-top:12px">
          ${cats.map(k => `
            <button data-stat="${k}" aria-pressed="${stat===k}">${k}</button>
          `).join("")}
        </div>

        <div style="text-align:right;margin:9px 0">
          <button data-minutes>${minutes?"Stat Graph":"Minutes Graph"}</button>
        </div>

        <div class="row" style="justify-content:flex-end;margin:9px 0">
          ${["All","Home","Away"].map(v => `
            <button data-venue="${v}" aria-pressed="${venue===v}">${v}</button>
          `).join("")}
        </div>

        <h3>Performance</h3>
        <div class="row">
          <span class="muted">Last</span>
          ${[5,10,20].map(v => `
            <button data-window="${v}" aria-pressed="${n===v}">${v}</button>
          `).join("")}
        </div>

        <div class="metrics">
          <div class="metric">
            <span class="muted">Season average</span>
            <strong>${fmt(avg(player,key))}</strong>
          </div>
          <div class="metric">
            <span class="muted">Last ${n} average</span>
            <strong>${recent}</strong>
          </div>
          <div class="metric">
            <span class="muted">Games</span>
            <strong>${games.length}</strong>
          </div>
        </div>

        ${chart(player)}

        <h3>Add to My Picks</h3>
        <div class="actions">
          ${["Over","Under"].map(side => `
            <button
              data-pick="${player.id}:${side}"
              aria-pressed="${selected(player.id,side)}"
              ${a===null?"disabled":""}
            >${selected(player.id,side)?"✓ ":""}${side}</button>
          `).join("")}
        </div>
      </details>
    `;
  }

  function render(open) {
    q("#nav").innerHTML = `
      <button data-game="all" aria-pressed="${game==="all"&&!myPicks}">All Games</button>
    ` + data.games.map(g => `
      <button data-game="${esc(g.id)}" aria-pressed="${game===String(g.id)&&!myPicks}">
        ${esc(g.away)} @ ${esc(g.home)}
      </button>
    `).join("");

    q("#picks").textContent = `${myPicks?"← Back · ":""}My Picks (${picks.length})`;
    q("#search").hidden = myPicks;

    let html = "";

    if (myPicks) {
      html = "<h2>My Picks</h2>" + (
        picks.length
          ? picks.map((p,i) => `
            <div class="group">
              ${identity(p)}
              <p>${p.side} season ${p.stat} average · ${fmt(p.average)}</p>
              <button data-remove="${i}">Remove</button>
            </div>
          `).join("")
          : '<p class="muted">No picks saved.</p>'
      );
    } else if (game==="all") {
      html = `
        <div class="row" style="justify-content:space-between">
          <h2>Above & Below Season Average</h2>
          <span class="muted">Last ${n} · ${stat}</span>
        </div>
      `;

      for (const g of data.games) {
        const shown = [g.away_id,g.home_id].flatMap(id =>
          data.players.filter(p =>
            p.team_id===id && matches(p) && avg(p,stat)!==null
          ).slice(0,2)
        );

        if (shown.length) {
          html += `
            <section class="group">
              <h3>${esc(g.away)} @ ${esc(g.home)}</h3>
              <div class="grid">
                ${shown.map(p => `
                  <button class="tile" data-open="${p.id}" data-match="${esc(g.id)}">
                    ${identity(p)}
                    <p class="muted">Season ${stat} avg · ${fmt(avg(p,stat))}</p>
                    <strong>${trend(p)}</strong>
                  </button>
                `).join("")}
              </div>
            </section>
          `;
        }
      }

      if (search.trim()) {
        const scheduled = new Set(
          data.games.flatMap(g => [g.home_id,g.away_id])
        );

        const others = data.players.filter(p =>
          matches(p) &&
          avg(p,stat)!==null &&
          !scheduled.has(p.team_id)
        );

        if (others.length) {
          html += "<h2>Other Players</h2>"+others.map(detail).join("");
        }
      }

      if (!data.games.length && !search.trim()) {
        html += '<p class="muted">No games are saved for today. Search a player to view their saved history.</p>';
      }
    } else {
      const g = data.games.find(g => String(g.id)===game);

      if (g) {
        html = `
          <h2>${esc(g.away)} @ ${esc(g.home)}</h2>
          <div class="row">
            ${["All",g.away,g.home].map(t => `
              <button data-team="${esc(t)}" aria-pressed="${t===team}">${esc(t)}</button>
            `).join("")}
          </div>
        ` + data.players.filter(p =>
          [g.home_id,g.away_id].includes(p.team_id) &&
          (team==="All" || p.team===team) &&
          matches(p)
        ).map(detail).join("");
      }
    }

    q("#content").innerHTML = html;

    if (open!==undefined) {
      const section = q(`[data-player="${open}"]`);
      if (section) section.open=true;
    }
  }

  q("main").addEventListener("click",event => {
    const button = event.target.closest("button");
    if (!button) return;

    const action = button.dataset;
    const open = button.closest("[data-player]")?.dataset.player;

    if (action.box) {
      const [id,index] = action.box.split(":").map(Number);
      const player = data.players.find(p => p.id===id);

      if (player && player.logs[index]) {
        showBox(player,player.logs[index]);
      }

      return;
    }

    if ("closeBox" in action) {
      q("#box-dialog").close();
      return;
    }

    if (button.id==="picks") {
      myPicks=!myPicks;
      render();
    } else if (action.game) {
      game=action.game;
      team="All";
      venue="All";
      myPicks=false;
      render();
    } else if (action.open) {
      game=action.match;
      team="All";
      render(action.open);
    } else if (action.team) {
      team=action.team;
      render();
    } else if (action.stat) {
      stat=action.stat;
      render(open);
    } else if (action.window) {
      n=Number(action.window);
      render(open);
    } else if ("minutes" in action) {
      minutes=!minutes;
      render(open);
    } else if (action.venue) {
      venue=action.venue;
      render(open);
    } else if (action.pick) {
      const [id,side] = action.pick.split(":");
      const player = data.players.find(p => p.id===Number(id));
      if (!player) return;

      const existing = picks.findIndex(p =>
        p.id===Number(id) && p.stat===stat && p.side===side
      );

      if (existing<0) {
        picks.push({
          id:player.id,
          name:player.name,
          team:player.team,
          position:player.position,
          height:player.height,
          weight:player.weight,
          stat,
          side,
          average:avg(player,stat),
          saved_at:new Date().toISOString()
        });
      } else {
        picks.splice(existing,1);
      }

      save();
      render(open);
    } else if (action.remove!==undefined) {
      picks.splice(Number(action.remove),1);
      save();
      render();
    }
  });

  q("#search").addEventListener("input",event => {
    search=event.target.value;
    render();
  });

  async function load() {
    try {
      const response = await fetch("/api/dashboard",{cache:"no-store"});
      const result = await response.json();

      if (!response.ok) throw Error(result.error);

      data=result;

      q("#status").textContent =
        `${result.date} · ${result.season} · Saved game statistics` +
        (
          result.updated_at
            ? " · Data updated "+new Date(result.updated_at).toLocaleString()
            : ""
        );

      render();
    } catch (error) {
      q("#status").textContent = navigator.onLine
        ? "Saved NBA data could not load. Reload to try again."
        : "Offline · Reconnect to load current NBA stats.";

      render();
    }
  }

  render();
  load();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js").catch(() => {});
  }
})();
</script>
</body>
</html>
