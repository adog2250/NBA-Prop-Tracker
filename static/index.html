<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ZenStats">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>ZenStats</title>

<style>
:root{color-scheme:dark}
body{margin:0;background:#000;color:#f4f5fb;font:13px system-ui,sans-serif}
*{box-sizing:border-box}
main{max-width:780px;margin:auto;padding:20px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:20px}
button,input{font:inherit;color:inherit;background:#242e40;border:1px solid #3d4a60;border-radius:18px;padding:7px 11px}
button{cursor:pointer}
button[aria-pressed=true]{background:#f4f5fb;color:#161b27}
h2{font-size:15px;margin:16px 0 10px}
h3{font-size:13px;margin:12px 0}
.muted{font-size:11px;color:#afbdd1}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.group{background:#1b2535;padding:12px;border-radius:11px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:#283348;border:0;border-radius:8px;padding:12px;text-align:left;width:100%}
.identity{display:flex;gap:9px;align-items:center;margin-bottom:8px}
img{width:36px;height:36px;object-fit:cover;border-radius:50%;background:#35435a}
.green{color:#97ff42}
.red{color:#ff738b}
details{background:#1d283b;border:1px solid #3c4b63;border-radius:10px;padding:12px;margin:9px 0}
summary{list-style:none;cursor:pointer}
summary::after{content:"⌄";float:right}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:15px 0}
.metric{background:#2b374c;border-radius:7px;padding:11px;text-align:center}
.metric strong{display:block;margin-top:5px}
.plot{position:relative;height:210px;padding:25px 4px 30px;margin:20px 0 8px}
.bars{height:100%;display:flex;gap:5px;align-items:end;background:repeating-linear-gradient(to top,transparent 0,transparent 37px,#ffffff15 38px)}
.column{position:relative;flex:1;height:100%;display:flex;align-items:end;min-width:0}
.bar{width:100%;position:relative;min-height:2px}
.number{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:11px;font-weight:500}
.opponent{position:absolute;bottom:-23px;left:0;right:0;text-align:center;font-size:10px;color:#b2bed2}
.average{position:absolute;left:4px;right:4px;border-top:2px solid white;pointer-events:none}
.average span{position:absolute;right:0;bottom:0;font-size:11px;background:#1d283b}
.actions{display:flex;gap:8px}
.actions button{flex:1;border-radius:6px;background:#20834e;border-color:#61d897;color:white}
.actions button:last-child{background:#bc3f57;border-color:#ff7e97}
.actions button[aria-pressed=true]{box-shadow:inset 0 0 0 2px white}
#search{width:100%;border-radius:8px;margin-top:14px}
#nav{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
#nav button{white-space:nowrap;flex-shrink:0}

@media(max-width:480px){
  main{padding-left:12px;padding-right:12px}
  .tile{padding:9px}
  .identity{flex-wrap:wrap}
  .bars{gap:3px}
}

@media(pointer:coarse){
  button,summary{min-height:44px}
  input{font-size:16px}
}
</style>
</head>

<body>
<main>
  <header>
    <strong><span class="green">▥</span> ZenStats</strong>
    <button id="picks">My Picks (0)</button>
  </header>

  <h2>Today's Games</h2>

  <p id="status" class="muted" role="status">
    Loading saved NBA data…
  </p>

  <nav id="nav" class="row" aria-label="Games"></nav>

  <input
    id="search"
    type="search"
    placeholder="Search players…"
    aria-label="Search players"
  >

  <p id="save-status" class="muted" role="status" hidden></p>

  <div id="content"></div>
</main>

<script>
(() => {
  const q = selector => document.querySelector(selector);

  const cats = [
    "PTS", "REB", "AST", "3PM",
    "PR", "PA", "RA", "PRA",
    "STL", "BLK"
  ];

  let data = {
    players: [],
    games: []
  };

  let game = "all";
  let team = "All";
  let stat = "PTS";
  let n = 5;
  let venue = "All";
  let minutes = false;
  let search = "";
  let myPicks = false;
  let picks = [];

  const storageKey = "nba-prop-tracker-picks-v1";

  const esc = value => String(value ?? "").replace(
    /[&<>"']/g,
    character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[character])
  );

  function storageMessage() {
    q("#save-status").hidden = false;

    q("#save-status").textContent =
      "Picks could not be saved on this device. " +
      "They will last for this session only.";
  }

  try {
    const saved = JSON.parse(
      localStorage.getItem(storageKey) || "[]"
    );

    if (Array.isArray(saved)) {
      picks = saved.filter(pick =>
        Number.isInteger(pick.id) &&
        typeof pick.name === "string" &&
        cats.includes(pick.stat) &&
        ["Over", "Under"].includes(pick.side) &&
        Number.isFinite(pick.average)
      );
    }
  } catch (error) {
    storageMessage();
  }

  function save() {
    try {
      localStorage.setItem(
        storageKey,
        JSON.stringify(picks)
      );
    } catch (error) {
      storageMessage();
    }
  }

  function val(gameLog, key) {
    const combinations = {
      PR: ["PTS", "REB"],
      PA: ["PTS", "AST"],
      RA: ["REB", "AST"],
      PRA: ["PTS", "REB", "AST"]
    };

    const keys = combinations[key] || [key];

    if (!keys.every(field =>
      typeof gameLog[field] === "number" &&
      Number.isFinite(gameLog[field])
    )) {
      return null;
    }

    return keys.reduce(
      (total, field) => total + gameLog[field],
      0
    );
  }

  function avg(player, key) {
    const values = player.logs
      .map(log => val(log, key))
      .filter(value => value !== null);

    if (!values.length) {
      return null;
    }

    return values.reduce(
      (total, value) => total + value,
      0
    ) / values.length;
  }

  const fmt = value =>
    value === null ? "—" : value.toFixed(1);

  function chosen(player, key) {
    return player.logs
      .filter(log =>
        (
          venue === "All" ||
          log.home === (venue === "Home")
        ) &&
        val(log, key) !== null
      )
      .slice(0, n);
  }

  const matches = player =>
    player.name.toLowerCase().includes(
      search.trim().toLowerCase()
    );

  const selected = (id, side) =>
    picks.some(pick =>
      pick.id === id &&
      pick.stat === stat &&
      pick.side === side
    );

  function identity(player) {
    const url = player.id < 0
      ? `https://a.espncdn.com/i/headshots/nba/players/full/${Math.abs(player.id)}.png`
      : `https://cdn.nba.com/headshots/nba/latest/260x190/${player.id}.png`;

    return `
      <span class="identity">
        <img
          src="${url}"
          alt="${esc(player.name)}"
          loading="lazy"
        >
        <span>
          <span class="muted">${esc(player.team)}</span>
          <br>
          <strong>${esc(player.name)}</strong>
        </span>
      </span>
    `;
  }

  function trend(player) {
    const average = avg(player, stat);

    const games = player.logs
      .filter(log => val(log, stat) !== null)
      .slice(0, n);

    const above = games.filter(
      log => val(log, stat) > average + 1e-9
    ).length;

    const below = games.filter(
      log => val(log, stat) < average - 1e-9
    ).length;

    if (average === null) {
      return '<span class="muted">No saved history</span>';
    }

    if (above === below) {
      return `
        <span class="muted">
          Above / Below tied ·
          ${above}/${games.length} each
        </span>
      `;
    }

    return `
      <span class="${above > below ? "green" : "red"}">
        ${above > below ? "Above" : "Below"}
        ${Math.max(above, below)}/${games.length}
      </span>
    `;
  }

  function chart(player) {
    const key = minutes ? "MIN" : stat;
    const average = avg(player, key);

    const games = chosen(player, key)
      .slice()
      .reverse();

    if (!games.length) {
      return `
        <p class="muted">
          No saved games for this selection.
        </p>
      `;
    }

    const maximum = Math.max(
      1,
      average,
      ...games.map(log =>
        key === "3PM"
          ? Math.max(log["3PA"] ?? 0, log[key])
          : val(log, key)
      )
    ) * 1.2;

    const bars = games.map((log, index) => {
      const value = val(log, key);

      const attemptsBar =
        key === "3PM" &&
        Number.isFinite(log["3PA"])
          ? `
            <div style="
              position:absolute;
              bottom:0;
              width:100%;
              height:${100 * log["3PA"] / maximum}%;
              background:#596982;
            ">
              <span
                class="number"
                style="color:#bbc8dd"
              >
                ${log["3PA"]}
              </span>
            </div>
          `
          : "";

      const color = value > average + 1e-9
        ? "#97ff42"
        : value < average - 1e-9
          ? "#ff667e"
          : "#efd16a";

      return `
        <div class="column">
          ${attemptsBar}

          <div
            class="bar"
            style="
              height:${100 * value / maximum}%;
              ${key === "3PM"
                ? "width:62%;margin:auto auto 0;"
                : ""}
              background:${color};
            "
          >
            <span class="number">${value}</span>
          </div>

          <span class="opponent">
            ${games.length <= 10
              ? esc(log.opp)
              : index + 1}
          </span>
        </div>
      `;
    }).join("");

    const missingAttempts =
      key === "3PM" &&
      games.some(log => log["3PA"] === null);

    return `
      <div
        class="plot"
        role="img"
        aria-label="Recent ${esc(key)} compared with season average"
      >
        <div class="bars">${bars}</div>

        <div
          class="average"
          style="bottom:calc(30px + 155px * ${average / maximum});"
        >
          <span>AVG ${fmt(average)}</span>
        </div>
      </div>

      <p class="muted">
        ${key === "3PM"
          ? "Muted background: attempted · Colored bar: made<br>"
          : ""}
        Green: above · Red: below ·
        Yellow: equal · White: season average
      </p>

      ${missingAttempts
        ? `
          <p class="muted">
            Attempts unavailable for some games;
            no attempts bar is shown for those games.
          </p>
        `
        : ""}
    `;
  }

  function detail(player) {
    const key = minutes ? "MIN" : stat;
    const games = chosen(player, key);
    const average = avg(player, stat);

    const recentAverage = games.length
      ? fmt(
          games.reduce(
            (total, log) => total + val(log, key),
            0
          ) / games.length
        )
      : "—";

    return `
      <details data-player="${player.id}">
        <summary>
          ${identity(player)}

          <span class="muted">
            PTS ${fmt(avg(player, "PTS"))} ·
            REB ${fmt(avg(player, "REB"))} ·
            AST ${fmt(avg(player, "AST"))}
          </span>
        </summary>

        <div class="row" style="margin-top:12px">
          ${cats.map(category => `
            <button
              data-stat="${category}"
              aria-pressed="${stat === category}"
            >
              ${category}
            </button>
          `).join("")}
        </div>

        <div style="text-align:right;margin:9px 0">
          <button data-minutes>
            ${minutes ? "Stat Graph" : "Minutes Graph"}
          </button>
        </div>

        <div
          class="row"
          style="justify-content:flex-end;margin:9px 0"
        >
          ${["All", "Home", "Away"].map(location => `
            <button
              data-venue="${location}"
              aria-pressed="${venue === location}"
            >
              ${location}
            </button>
          `).join("")}
        </div>

        <h3>Performance</h3>

        <div class="row">
          <span class="muted">Last</span>

          ${[5, 10, 20].map(window => `
            <button
              data-window="${window}"
              aria-pressed="${n === window}"
            >
              ${window}
            </button>
          `).join("")}
        </div>

        <div class="metrics">
          <div class="metric">
            <span class="muted">Season average</span>
            <strong>${fmt(avg(player, key))}</strong>
          </div>

          <div class="metric">
            <span class="muted">Last ${n} average</span>
            <strong>${recentAverage}</strong>
          </div>

          <div class="metric">
            <span class="muted">Games</span>
            <strong>${games.length}</strong>
          </div>
        </div>

        ${chart(player)}

        <h3>Add to My Picks</h3>

        <div class="actions">
          ${["Over", "Under"].map(side => `
            <button
              data-pick="${player.id}:${side}"
              aria-pressed="${selected(player.id, side)}"
              ${average === null ? "disabled" : ""}
            >
              ${selected(player.id, side) ? "✓ " : ""}${side}
            </button>
          `).join("")}
        </div>
      </details>
    `;
  }

  function render(open) {
    q("#nav").innerHTML = `
      <button
        data-game="all"
        aria-pressed="${game === "all" && !myPicks}"
      >
        All Games
      </button>
    ` + data.games.map(matchup => `
      <button
        data-game="${esc(matchup.id)}"
        aria-pressed="${game === String(matchup.id) && !myPicks}"
      >
        ${esc(matchup.away)} @ ${esc(matchup.home)}
      </button>
    `).join("");

    q("#picks").textContent =
      `${myPicks ? "← Back · " : ""}` +
      `My Picks (${picks.length})`;

    q("#search").hidden = myPicks;

    let html = "";

    if (myPicks) {
      html = "<h2>My Picks</h2>";

      html += picks.length
        ? picks.map((pick, index) => `
          <div class="group">
            ${identity(pick)}

            <p>
              ${pick.side} season ${pick.stat}
              average · ${fmt(pick.average)}
            </p>

            <button data-remove="${index}">
              Remove
            </button>
          </div>
        `).join("")
        : '<p class="muted">No picks saved.</p>';

    } else if (game === "all") {
      html = `
        <div
          class="row"
          style="justify-content:space-between"
        >
          <h2>Above & Below Season Average</h2>
          <span class="muted">Last ${n} · ${stat}</span>
        </div>
      `;

      for (const matchup of data.games) {
        const shown = [
          matchup.away_id,
          matchup.home_id
        ].flatMap(teamId =>
          data.players.filter(player =>
            player.team_id === teamId &&
            matches(player) &&
            avg(player, stat) !== null
          ).slice(0, 2)
        );

        if (shown.length) {
          html += `
            <section class="group">
              <h3>
                ${esc(matchup.away)} @ ${esc(matchup.home)}
              </h3>

              <div class="grid">
                ${shown.map(player => `
                  <button
                    class="tile"
                    data-open="${player.id}"
                    data-match="${esc(matchup.id)}"
                  >
                    ${identity(player)}

                    <p class="muted">
                      Season ${stat} avg ·
                      ${fmt(avg(player, stat))}
                    </p>

                    <strong>${trend(player)}</strong>
                  </button>
                `).join("")}
              </div>
            </section>
          `;
        }
      }

      if (search.trim()) {
        const scheduled = new Set(
          data.games.flatMap(matchup => [
            matchup.home_id,
            matchup.away_id
          ])
        );

        const others = data.players.filter(player =>
          matches(player) &&
          avg(player, stat) !== null &&
          !scheduled.has(player.team_id)
        );

        if (others.length) {
          html += "<h2>Other Players</h2>";
          html += others.map(detail).join("");
        }
      }

      if (!data.games.length && !search.trim()) {
        html += `
          <p class="muted">
            No games are saved for today.
            Search a player to view their saved history.
          </p>
        `;
      }

    } else {
      const matchup = data.games.find(
        item => String(item.id) === game
      );

      if (matchup) {
        html = `
          <h2>
            ${esc(matchup.away)} @ ${esc(matchup.home)}
          </h2>

          <div class="row">
            ${[
              "All",
              matchup.away,
              matchup.home
            ].map(teamName => `
              <button
                data-team="${esc(teamName)}"
                aria-pressed="${teamName === team}"
              >
                ${esc(teamName)}
              </button>
            `).join("")}
          </div>
        `;

        html += data.players.filter(player =>
          [
            matchup.home_id,
            matchup.away_id
          ].includes(player.team_id) &&
          (
            team === "All" ||
            player.team === team
          ) &&
          matches(player)
        ).map(detail).join("");
      }
    }

    q("#content").innerHTML = html;

    if (open !== undefined) {
      const playerSection = q(
        `[data-player="${open}"]`
      );

      if (playerSection) {
        playerSection.open = true;
      }
    }
  }

  q("main").addEventListener("click", event => {
    const button = event.target.closest("button");

    if (!button) {
      return;
    }

    const action = button.dataset;

    const open = button.closest(
      "[data-player]"
    )?.dataset.player;

    if (button.id === "picks") {
      myPicks = !myPicks;
      render();

    } else if (action.game) {
      game = action.game;
      team = "All";
      venue = "All";
      myPicks = false;
      render();

    } else if (action.open) {
      game = action.match;
      team = "All";
      render(action.open);

    } else if (action.team) {
      team = action.team;
      render();

    } else if (action.stat) {
      stat = action.stat;
      render(open);

    } else if (action.window) {
      n = Number(action.window);
      render(open);

    } else if ("minutes" in action) {
      minutes = !minutes;
      render(open);

    } else if (action.venue) {
      venue = action.venue;
      render(open);

    } else if (action.pick) {
      const [id, side] = action.pick.split(":");

      const player = data.players.find(
        item => item.id === Number(id)
      );

      if (!player) {
        return;
      }

      const existing = picks.findIndex(pick =>
        pick.id === Number(id) &&
        pick.stat === stat &&
        pick.side === side
      );

      if (existing < 0) {
        picks.push({
          id: player.id,
          name: player.name,
          team: player.team,
          stat,
          side,
          average: avg(player, stat),
          saved_at: new Date().toISOString()
        });
      } else {
        picks.splice(existing, 1);
      }

      save();
      render(open);

    } else if (action.remove !== undefined) {
      picks.splice(Number(action.remove), 1);
      save();
      render();
    }
  });

  q("#search").addEventListener("input", event => {
    search = event.target.value;
    render();
  });

  async function load() {
    try {
      const response = await fetch(
        "/api/dashboard",
        { cache: "no-store" }
      );

      const result = await response.json();

      if (!response.ok) {
        throw Error(result.error);
      }

      data = result;

      q("#status").textContent =
        `${result.date} · ${result.season} · ` +
        "Saved game statistics" +
        (
          result.updated_at
            ? (
                " · Data updated " +
                new Date(result.updated_at).toLocaleString()
              )
            : ""
        );

      render();

    } catch (error) {
      q("#status").textContent = navigator.onLine
        ? "Saved NBA data could not load. Reload to try again."
        : "Offline · Reconnect to load current NBA stats.";

      render();
    }
  }

  render();
  load();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker
      .register("/service-worker.js")
      .catch(() => {});
  }
})();
</script>
</body>
</html>
