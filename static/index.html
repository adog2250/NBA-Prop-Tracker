<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="NBA Tracker"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><title>NBA Prop Tracker</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#000;color:#f4f5fb;font:13px system-ui,sans-serif}*{box-sizing:border-box}main{max-width:780px;margin:auto;padding:20px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:20px}button,input{font:inherit;color:inherit;background:#242e40;border:1px solid #3d4a60;border-radius:18px;padding:7px 11px}button{cursor:pointer}button[aria-pressed=true]{background:#f4f5fb;color:#161b27}h2{font-size:15px;margin:16px 0 10px}h3{font-size:13px;margin:12px 0}.muted{font-size:11px;color:#afbdd1}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.group{background:#1b2535;padding:12px;border-radius:11px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{background:#283348;border:0;border-radius:8px;padding:12px;text-align:left;width:100%}.identity{display:flex;gap:9px;align-items:center;margin-bottom:8px}img{width:36px;height:36px;object-fit:cover;border-radius:50%;background:#35435a}.green{color:#97ff42}.red{color:#ff738b}details{background:#1d283b;border:1px solid #3c4b63;border-radius:10px;padding:12px;margin:9px 0}summary{list-style:none;cursor:pointer}summary:after{content:'⌄';float:right}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:15px 0}.metric{background:#2b374c;border-radius:7px;padding:11px;text-align:center}.metric strong{display:block;margin-top:5px}.plot{position:relative;height:210px;padding:25px 4px 30px;margin:20px 0 8px}.bars{height:100%;display:flex;gap:5px;align-items:end;background:repeating-linear-gradient(to top,transparent 0,transparent 37px,#ffffff15 38px)}.column{position:relative;flex:1;height:100%;display:flex;align-items:end;min-width:0}.bar{width:100%;position:relative;min-height:2px}.number{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:11px;font-weight:500}.opponent{position:absolute;bottom:-23px;left:0;right:0;text-align:center;font-size:10px;color:#b2bed2}.average{position:absolute;left:4px;right:4px;border-top:2px solid white;pointer-events:none}.average span{position:absolute;right:0;bottom:0;font-size:11px;background:#1d283b}.actions{display:flex;gap:8px}.actions button{flex:1;border-radius:6px;background:#20834e;border-color:#61d897;color:white}.actions button:last-child{background:#bc3f57;border-color:#ff7e97}.actions button[aria-pressed=true]{box-shadow:inset 0 0 0 2px white}#search{width:100%;border-radius:8px;margin-top:14px}#nav{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}#nav button{white-space:nowrap;flex-shrink:0}@media(max-width:480px){main{padding-left:12px;padding-right:12px}.tile{padding:9px}.identity{flex-wrap:wrap}.bars{gap:3px}}@media(pointer:coarse){button,summary{min-height:44px}input{font-size:16px}}
</style></head><body><main><header><strong><span class="green">▥</span> NBA Prop Tracker</strong><button id="picks">My Picks (0)</button></header><h2>Today's Games</h2><p id="status" class="muted" role="status">Loading saved NBA data…</p><nav id="nav" class="row" aria-label="Games"></nav><input id="search" type="search" placeholder="Search players…" aria-label="Search players"><p id="save-status" class="muted" role="status" hidden></p><div id="content"></div></main>
<script>
(()=>{const q=s=>document.querySelector(s),cats=['PTS','REB','AST','3PM','PR','PA','RA','PRA','STL','BLK'];let data={players:[],games:[]},game='all',team='All',stat='PTS',n=5,venue='All',minutes=false,search='',myPicks=false,picks=[];const storageKey='nba-prop-tracker-picks-v1';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function storageMessage(){q('#save-status').hidden=false;q('#save-status').textContent='Picks could not be saved on this device. They will last for this session only.'}try{const saved=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(saved))picks=saved.filter(x=>Number.isInteger(x.id)&&typeof x.name==='string'&&cats.includes(x.stat)&&['Over','Under'].includes(x.side)&&Number.isFinite(x.average));}catch(e){storageMessage()}function save(){try{localStorage.setItem(storageKey,JSON.stringify(picks))}catch(e){storageMessage()}}
const val=(g,k)=>{let keys=({PR:['PTS','REB'],PA:['PTS','AST'],RA:['REB','AST'],PRA:['PTS','REB','AST']})[k]||[k];return keys.every(s=>typeof g[s]==='number'&&Number.isFinite(g[s]))?keys.reduce((s,f)=>s+g[f],0):null};const avg=(p,k)=>{let g=p.logs.map(x=>val(x,k)).filter(x=>x!==null);return g.length?g.reduce((a,b)=>a+b,0)/g.length:null};const fmt=v=>v===null?'—':v.toFixed(1);const chosen=(p,k)=>p.logs.filter(g=>(venue==='All'||g.home===(venue==='Home'))&&val(g,k)!==null).slice(0,n);const matches=p=>p.name.toLowerCase().includes(search.trim().toLowerCase());const selected=(id,side)=>picks.some(x=>x.id===id&&x.stat===stat&&x.side===side);
function identity(p){let url=p.id<0?`https://a.espncdn.com/i/headshots/nba/players/full/${Math.abs(p.id)}.png`:`https://cdn.nba.com/headshots/nba/latest/260x190/${p.id}.png`;return `<span class="identity"><img src="${url}" alt="${esc(p.name)}" loading="lazy"><span><span class="muted">${esc(p.team)}</span><br><strong>${esc(p.name)}</strong></span></span>`}
function trend(p){let a=avg(p,stat),g=p.logs.filter(x=>val(x,stat)!==null).slice(0,n),above=g.filter(x=>val(x,stat)>a+1e-9).length,below=g.filter(x=>val(x,stat)<a-1e-9).length;if(a===null)return '<span class="muted">No saved history</span>';return above===below?`<span class="muted">Above / Below tied · ${above}/${g.length} each</span>`:`<span class="${above>below?'green':'red'}">${above>below?'Above':'Below'} ${Math.max(above,below)}/${g.length}</span>`}
function chart(p){let k=minutes?'MIN':stat,a=avg(p,k),g=chosen(p,k).slice().reverse();if(!g.length)return '<p class="muted">No saved games for this selection.</p>';let max=Math.max(1,a,...g.map(x=>k==='3PM'?Math.max(x['3PA']??0,x[k]):val(x,k)))*1.2;return `<div class="plot" role="img" aria-label="Recent ${esc(k)} compared with season average"><div class="bars">${g.map((x,j)=>{let v=val(x,k);return `<div class="column">${k==='3PM'&&Number.isFinite(x['3PA'])?`<div style="position:absolute;bottom:0;width:100%;height:${100*x['3PA']/max}%;background:#596982"><span class="number" style="color:#bbc8dd">${x['3PA']}</span></div>`:''}<div class="bar" style="height:${100*v/max}%;${k==='3PM'?'width:62%;margin:auto auto 0;':''}background:${v>a+1e-9?'#97ff42':v<a-1e-9?'#ff667e':'#efd16a'}"><span class="number">${v}</span></div><span class="opponent">${g.length<=10?esc(x.opp):j+1}</span></div>`}).join('')}</div><div class="average" style="bottom:calc(30px + 155px * ${a/max})"><span>AVG ${fmt(a)}</span></div></div><p class="muted">${k==='3PM'?'Muted background: attempted · Colored bar: made<br>':''}Green: above · Red: below · Yellow: equal · White: season average</p>${k==='3PM'&&g.some(x=>x['3PA']===null)?'<p class="muted">Attempts unavailable for some games; no attempts bar is shown for those games.</p>':''}`}
function detail(p){let k=minutes?'MIN':stat,g=chosen(p,k),a=avg(p,stat);return `<details data-player="${p.id}"><summary>${identity(p)}<span class="muted">PTS ${fmt(avg(p,'PTS'))} · REB ${fmt(avg(p,'REB'))} · AST ${fmt(avg(p,'AST'))}</span></summary><div class="row" style="margin-top:12px">${cats.map(k=>`<button data-stat="${k}" aria-pressed="${stat===k}">${k}</button>`).join('')}</div><div style="text-align:right;margin:9px 0"><button data-minutes>${minutes?'Stat Graph':'Minutes Graph'}</button></div><div class="row" style="justify-content:flex-end;margin:9px 0">${['All','Home','Away'].map(v=>`<button data-venue="${v}" aria-pressed="${venue===v}">${v}</button>`).join('')}</div><h3>Performance</h3><div class="row"><span class="muted">Last</span>${[5,10,20].map(v=>`<button data-window="${v}" aria-pressed="${n===v}">${v}</button>`).join('')}</div><div class="metrics"><div class="metric"><span class="muted">Season average</span><strong>${fmt(avg(p,k))}</strong></div><div class="metric"><span class="muted">Last ${n} average</span><strong>${g.length?fmt(g.reduce((s,x)=>s+val(x,k),0)/g.length):'—'}</strong></div><div class="metric"><span class="muted">Games</span><strong>${g.length}</strong></div></div>${chart(p)}<h3>Add to My Picks</h3><div class="actions">${['Over','Under'].map(side=>`<button data-pick="${p.id}:${side}" aria-pressed="${selected(p.id,side)}" ${a===null?'disabled':''}>${selected(p.id,side)?'✓ ':''}${side}</button>`).join('')}</div></details>`}
function render(open){q('#nav').innerHTML=`<button data-game="all" aria-pressed="${game==='all'&&!myPicks}">All Games</button>`+data.games.map(g=>`<button data-game="${esc(g.id)}" aria-pressed="${game===String(g.id)&&!myPicks}">${esc(g.away)} vs ${esc(g.home)}</button>`).join('');q('#picks').textContent=`${myPicks?'← Back · ':''}My Picks (${picks.length})`;q('#search').hidden=myPicks;let html='';if(myPicks){html='<h2>My Picks</h2>'+(picks.length?picks.map((x,j)=>`<div class="group">${identity(x)}<p>${x.side} season ${x.stat} average · ${fmt(x.average)}</p><button data-remove="${j}">Remove</button></div>`).join(''):'<p class="muted">No picks saved.</p>');}else if(game==='all'){html=`<div class="row" style="justify-content:space-between"><h2>Above & Below Season Average</h2><span class="muted">Last ${n} · ${stat}</span></div>`;for(let g of data.games){let shown=[g.away_id,g.home_id].flatMap(t=>data.players.filter(p=>p.team_id===t&&matches(p)).slice(0,2));if(shown.length)html+=`<section class="group"><h3>${esc(g.away)} vs ${esc(g.home)}</h3><div class="grid">${shown.map(p=>`<button class="tile" data-open="${p.id}" data-match="${esc(g.id)}">${identity(p)}<p class="muted">Season ${stat} avg · ${fmt(avg(p,stat))}</p><strong>${trend(p)}</strong></button>`).join('')}</div></section>`;}if(search.trim()){let scheduled=new Set(data.games.flatMap(g=>[g.home_id,g.away_id])),others=data.players.filter(p=>matches(p)&&!scheduled.has(p.team_id));if(others.length)html+='<h2>Other Players</h2>'+others.map(detail).join('');}if(!data.games.length&&!search.trim())html+='<p class="muted">No games are saved for today. Search a player to view their saved history.</p>';}else{let g=data.games.find(g=>String(g.id)===game);if(g){html=`<h2>${esc(g.away)} vs ${esc(g.home)}</h2><div class="row">${['All',g.away,g.home].map(t=>`<button data-team="${esc(t)}" aria-pressed="${t===team}">${esc(t)}</button>`).join('')}</div>`+data.players.filter(p=>[g.home_id,g.away_id].includes(p.team_id)&&(team==='All'||p.team===team)&&matches(p)).map(detail).join('');}}q('#content').innerHTML=html;if(open!==undefined){let d=q(`[data-player="${open}"]`);if(d)d.open=true;}}
document.querySelector('main').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset,open=b.closest('[data-player]')?.dataset.player;if(b.id==='picks'){myPicks=!myPicks;render();}else if(d.game){game=d.game;team='All';venue='All';myPicks=false;render();}else if(d.open){game=d.match;team='All';render(d.open);}else if(d.team){team=d.team;render();}else if(d.stat){stat=d.stat;render(open);}else if(d.window){n=+d.window;render(open);}else if('minutes'in d){minutes=!minutes;render(open);}else if(d.venue){venue=d.venue;render(open);}else if(d.pick){let[id,side]=d.pick.split(':'),p=data.players.find(p=>p.id===+id),j=picks.findIndex(x=>x.id===+id&&x.stat===stat&&x.side===side);if(!p)return;if(j<0)picks.push({id:p.id,name:p.name,team:p.team,stat,side,average:avg(p,stat),saved_at:new Date().toISOString()});else picks.splice(j,1);save();render(open);}else if(d.remove!==undefined){picks.splice(+d.remove,1);save();render();}});q('#search').addEventListener('input',e=>{search=e.target.value;render()});async function load(){try{let r=await fetch('/api/dashboard',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);data=d;q('#status').textContent=`${d.date} · ${d.season} · Saved game statistics${d.updated_at?' · Data updated '+new Date(d.updated_at).toLocaleString():''}`;render();}catch(e){q('#status').textContent=navigator.onLine?'Saved NBA data could not load. Reload to try again.':'Offline · Reconnect to load current NBA stats.';render();}}render();load();if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
})();
</script></body></html>
