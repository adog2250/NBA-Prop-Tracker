<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ZenStats">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>ZenStats</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#f4f5fb;font:13px system-ui,sans-serif}
main{max-width:780px;margin:auto;padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
button,input{font:inherit;color:inherit;background:#242e40;border:1px solid #3d4a60;border-radius:16px;padding:5px 9px}
button{cursor:pointer}
button[aria-pressed=true]{background:#f4f5fb;color:#161b27}
h2{font-size:15px;margin:10px 0 6px}
h3{font-size:13px;margin:7px 0}
.muted{font-size:11px;color:#afbdd1}
.row{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.group{background:#1b2535;padding:8px;border-radius:11px;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{background:#283348;border:0;border-radius:8px;padding:8px;text-align:left;width:100%}
.tile p{margin:5px 0}
.identity{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.identity>span{min-width:0;max-width:100%}
img{width:36px;height:36px;object-fit:cover;border-radius:50%;background:#35435a}
.matchup-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:start}
.team-column{min-width:0}
.team-column .metrics{grid-template-columns:repeat(3,minmax(0,1fr))}
.team-column .metric{min-width:0;padding:6px 4px;overflow-wrap:anywhere}
.team-cards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;margin:8px 0}
.team-card{min-width:0;background:#1d283b;border:1px solid #3c4b63;border-radius:10px;padding:8px}
.team-card h3{margin:0 0 2px}
.team-heading{display:flex;align-items:center;justify-content:space-between;gap:5px}
.favorite-team-logo{width:28px;height:28px;object-fit:contain;background:transparent;border-radius:0}
.team-stat-row{display:flex;justify-content:space-between;align-items:baseline;gap:5px;padding:4px 0;border-bottom:1px solid #ffffff12}
.team-stat-row span{color:#afbdd1;font-size:11px}
.team-stat-row strong{white-space:nowrap;font-variant-numeric:tabular-nums}
.team-card p{margin:5px 0}
.app-columns{display:flex;flex-direction:column;gap:8px}
#content{min-width:0}
#favorites{order:-1;min-width:0}
.favorite-panel{background:#1b2535;border:1px solid #3c4b63;border-radius:10px;padding:8px}
.favorite-panel h2{margin:0 0 5px}
.favorite-panel h3{margin:7px 0 4px}
.favorite-panel p{margin:5px 0}
.favorite-row{display:flex;align-items:flex-start;gap:4px;margin:5px 0}
.favorite-open{flex:1;min-width:0;text-align:left;border-radius:8px;padding:6px}
.favorite-open .identity{margin-bottom:3px}
.favorite-star{flex-shrink:0;min-width:30px;padding:3px 6px;line-height:1.4}
.favorite-star[aria-pressed=true]{background:#242e40;color:#efd16a;border-color:#efd16a}
.player-heading{display:flex;align-items:flex-start;gap:5px}
.player-heading .identity{flex:1;min-width:0}
.player-name-row{display:inline-flex;align-items:center;gap:3px;max-width:100%;vertical-align:middle;flex-wrap:nowrap}
.player-name-row strong{min-width:0;overflow-wrap:break-word}
.player-name-row .player-favorite-star{flex-shrink:0;margin-left:0}
.green{color:#97ff42}
.red{color:#ff738b}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:8px 0}
.metric{background:#2b374c;border-radius:7px;padding:6px;text-align:center;min-width:0}
.metric strong{display:block;margin-top:2px}
.plot{position:relative;height:238px;padding:25px 4px 58px;margin:10px 0 4px}
.bars{height:100%;display:flex;gap:5px;align-items:end;background:repeating-linear-gradient(to top,transparent 0,transparent 37px,#ffffff15 38px)}
.column{position:relative;flex:1;height:100%;display:flex;align-items:end;min-width:0}
.bar{width:100%;position:relative;min-height:2px}
.number{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:11px;font-weight:500}
.opponent{position:absolute;top:100%;left:0;right:0;padding-top:7px;text-align:center;font-size:10px;color:#b2bed2;line-height:13px}
.opponent-logo{display:block;width:min(22px,100%);height:22px;object-fit:contain;border-radius:0;background:transparent;margin:0 auto 3px}
.game-date{display:block;font-size:8px;white-space:nowrap;color:#afbdd1}
.average{position:absolute;left:4px;right:4px;border-top:2px solid white;pointer-events:none}
.average span{position:absolute;right:0;bottom:0;font-size:11px;background:#1d283b}
.actions{display:flex;gap:6px}
.actions button{flex:1;border-radius:6px;background:#20834e;border-color:#61d897;color:white}
.actions button:last-child{background:#bc3f57;border-color:#ff7e97}
.actions button[aria-pressed=true]{box-shadow:inset 0 0 0 2px white}
#search{width:100%;border-radius:8px;margin-top:8px}
#status{margin:5px 0}
#nav{flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px}
#nav button{white-space:nowrap;flex-shrink:0}
.box-hit{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;border-radius:0;background:transparent;z-index:2;min-height:0}
.box-hit:focus-visible{outline:2px solid #fff;outline-offset:2px}
#box-dialog{background:#1d283b;color:#f4f5fb;border:1px solid #3c4b63;border-radius:12px;width:min(94vw,520px);max-height:85dvh;overflow:auto;padding:12px}
#box-dialog::backdrop{background:#000b}
.box-table{width:100%;border-collapse:collapse;margin-top:8px}
.box-table th,.box-table td{text-align:left;padding:6px;border-bottom:1px solid #ffffff20}
.box-table td{text-align:right;font-variant-numeric:tabular-nums}
#player-dialog{background:#1d283b;color:#f4f5fb;border:1px solid #3c4b63;border-radius:12px;width:min(960px,calc(100vw - 24px));max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);overflow:auto;padding:12px;overscroll-behavior:contain}
#player-dialog::backdrop{background:#000c}
.player-dialog-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.player-dialog-header h2{margin:0}
.player-card{background:#1d283b;border:1px solid #3c4b63;border-radius:10px;padding:8px;margin:6px 0;display:flex;align-items:flex-start;gap:5px}
.player-open{flex:1;min-width:0;text-align:left;padding:0;background:transparent;border:0;border-radius:0}
#player-dialog .plot{height:318px}
#player-dialog .average{bottom:calc(58px + 235px * var(--average-ratio))!important}
#player-dialog .player-stat-tabs{margin-top:6px!important}
#player-dialog .player-graph-mode,#player-dialog .player-venue{margin:2px 0!important}
#player-dialog p.muted{margin:5px 0;line-height:1.35}
#player-dialog h3{margin:5px 0}
.player-action-area{position:relative;isolation:isolate}
.player-action-overlay{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;border-radius:inherit;background:transparent;z-index:1}
.player-action-overlay:focus-visible{outline:2px solid #fff;outline-offset:2px}
.favorite-open.player-action-area{background:#242e40;border:1px solid #3d4a60}
.player-favorite-star{position:relative;z-index:2;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:3px;min-width:28px;min-height:24px;padding:0;border:0;border-radius:0;background:transparent;color:#afbdd1;box-shadow:none;font-size:20px;line-height:1}
.player-favorite-star[aria-pressed=true]{background:transparent;color:#efd16a;border:0;box-shadow:none}
#player-dialog .player-favorite-star{padding:0;font-size:20px;min-height:24px}
@media(min-width:1100px){
main{max-width:1080px}
.app-columns{display:grid;grid-template-columns:minmax(0,740px) 260px;align-items:start}
#favorites{order:0;position:sticky;top:12px;margin-top:8px}
}
@media(max-width:600px){
main{padding-left:8px;padding-right:8px;padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom))}
header{margin-bottom:8px}
h2{margin:8px 0 5px}
h3{margin:6px 0}
#search{margin-top:6px}
.app-columns{gap:6px}
.group{padding:7px;margin:6px 0}
.grid,.matchup-columns{gap:5px}
.tile,.player-card{padding:6px}
.player-card{margin:4px 0;gap:4px}
.identity{gap:5px;margin-bottom:3px;flex-wrap:wrap}
.favorite-panel{padding:7px}
.favorite-open{padding:5px}
.team-cards{margin:6px 0;gap:5px}
.team-card{padding:6px}
.team-stat-row{padding:3px 0;gap:4px}
.team-card p{margin:4px 0}
.bars{gap:3px}
#player-dialog{width:calc(100vw - 12px);max-width:calc(100vw - 12px);max-height:calc(100dvh - 12px);padding:8px;border-radius:10px}
.player-dialog-header{gap:6px;margin-bottom:4px}
.player-dialog-header h2{font-size:13px}
#player-dialog .identity{flex-wrap:nowrap;gap:6px;margin-bottom:3px}
#player-dialog .identity img{width:32px;height:32px;flex-shrink:0}
#player-dialog .player-stat-tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
#player-dialog button{font-size:12px;padding:4px 7px;min-height:40px}
#player-dialog .player-stat-tabs button{padding:3px}
#player-dialog .player-venue{gap:4px}
#player-dialog .player-venue button{padding:4px 6px}
#player-dialog .metrics{margin:6px 0}
#player-dialog .metric{padding:5px 3px}
#player-dialog .plot{height:200px;padding:20px 4px 44px;margin:8px 0 3px}
#player-dialog .average{bottom:calc(44px + 136px * var(--average-ratio))!important}
#player-dialog .opponent{padding-top:5px}
#player-dialog .opponent-logo{width:min(18px,100%);height:18px;margin-bottom:2px}
#player-dialog .game-date{font-size:9px}
#player-dialog .actions{gap:4px}
#player-dialog .box-hit{padding:0;min-height:0}
#player-dialog .player-favorite-star{min-height:24px;min-width:28px;padding:0;font-size:20px}
#box-dialog{padding:8px;max-height:calc(100dvh - 20px)}
}
@media(pointer:coarse){
button{min-height:40px}
input{font-size:16px}
.box-hit,.player-action-overlay{min-height:0}
.player-favorite-star{min-height:24px;min-width:28px}
.player-favorite-star::after{content:"";position:absolute;top:-10px;bottom:-10px;left:-8px;right:-8px}
button[data-stat],button[data-window],button[data-venue],button[data-team],button[data-minutes],button[data-close-player],button[data-pick],#nav button{position:relative}
button[data-stat]::after,button[data-window]::after,button[data-venue]::after,button[data-team]::after,button[data-minutes]::after,button[data-close-player]::after,button[data-pick]::after,#nav button::after{content:"";position:absolute;inset:-2px}
}
.team-comparison-panel{margin:6px 0 8px;padding:6px;background:#1d283b;border:1px solid #3c4b63;border-radius:10px}
.team-comparison{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
.team-comparison .stat-label-col{width:30%}
.team-comparison.one-team .stat-label-col{width:46%}
.team-comparison th,.team-comparison td{padding:4px 3px;border-bottom:1px solid #ffffff12;overflow-wrap:break-word}
.team-comparison td{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.team-comparison thead th{text-align:center}
.team-comparison tbody th,.team-comparison .stat-label{text-align:left;color:#afbdd1;font-size:11px;font-weight:400}
.team-comparison .comparison-record{font-size:11px;font-weight:400}
.comparison-team-name{display:flex;justify-content:center;align-items:center;gap:4px}
.team-comparison-panel .comparison-note{margin:4px 0;font-size:11px;line-height:1.3}
@media(max-width:600px){
.team-comparison th,.team-comparison td{padding:3px 2px}
.team-comparison-panel{padding:5px}
.comparison-team-name{gap:2px}
}
.sport-nav{justify-content:center;margin:0 0 8px}
.nfl-bars{height:100%;position:relative;display:flex;gap:5px;background:repeating-linear-gradient(to top,transparent 0,transparent 37px,#ffffff15 38px)}
.nfl-zero{position:absolute;left:0;right:0;border-top:1px solid #afbdd155;pointer-events:none}
.nfl-mean{position:absolute;left:0;right:0;border-top:2px solid white;pointer-events:none;z-index:3}
.nfl-mean span{position:absolute;right:0;bottom:0;font-size:11px;background:#1d283b}
</style>
</head>
<body>
<main>
<header>
<strong><span class="green">▥</span> ZenStats</strong>
<button id="picks">My Picks (0)</button>
</header>
<nav class="row sport-nav" aria-label="Sport">
<button data-sport="nba">NBA</button>
<button data-sport="nfl">NFL</button>
</nav>
<h2 id="games-title">Today's Games</h2>
<p id="status" class="muted" role="status">Loading saved NBA data…</p>
<nav id="nav" class="row" aria-label="Games"></nav>
<input id="search" type="search" placeholder="Search players…" aria-label="Search players">
<p id="save-status" class="muted" role="status" hidden></p>

<div class="app-columns">
<div id="content"></div>
<aside id="favorites" aria-label="Favorite players and teams scheduled today"></aside>
</div>

<dialog id="player-dialog" aria-labelledby="player-dialog-title">
<div class="player-dialog-header">
<h2 id="player-dialog-title">Player stats</h2>
<button data-close-player autofocus>Close</button>
</div>
<div id="player-dialog-content"></div>
</dialog>

<dialog id="box-dialog" aria-labelledby="box-title">
<div class="row" style="justify-content:space-between">
<h2 id="box-title">Player box score</h2>
<button data-close-box>Close</button>
</div>
<div id="box-content"></div>
</dialog>
</main>

<script>
(() => {
const q=selector=>document.querySelector(selector);
const sport=new URLSearchParams(location.search).get("sport")==="nfl"?"nfl":"nba";
const nflLabels={
PASS_YDS:"Pass yards",PASS_TD:"Pass TD",PASS_ATT:"Pass attempts",
PASS_CMP:"Completions",INT:"Interceptions thrown",
RUSH_YDS:"Rush yards",RUSH_ATT:"Carries",RUSH_TD:"Rush TD",
REC_YDS:"Rec yards",REC:"Receptions",TGTS:"Targets",REC_TD:"Rec TD",
FGM:"FG made",FGA:"FG attempts",XPM:"XP made",XPA:"XP attempts",
TACKLES:"Tackles",SACKS:"Sacks",DEF_INT:"Defensive INT",
PD:"Passes defended",FUM:"Fumbles",FUM_LOST:"Fumbles lost"
};
const cats=sport==="nfl"?Object.keys(nflLabels):
["PTS","REB","AST","3PM","PR","PA","RA","PRA","STL","BLK"];
const toId=value=>sport==="nfl"?String(value):Number(value);
const label=key=>sport==="nfl"?(nflLabels[key]||key):key;
let data={players:[],games:[],team_stats:{}};
let game="all",team="All",stat=sport==="nfl"?"PASS_YDS":"PTS",n=5,venue="All";
let minutes=false,search="",myPicks=false;
let activePlayer=null;
let picks=[],favorites=[],favoriteTeams=[];
const storageKey=sport==="nfl"?"zenstats-nfl-picks-v1":"nba-prop-tracker-picks-v1";
const favoritesKey=sport==="nfl"?"zenstats-nfl-favorite-players-v1":"zenstats-favorite-players-v1";
const favoriteTeamsKey=sport==="nfl"?"zenstats-nfl-favorite-teams-v1":"zenstats-favorite-teams-v1";
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function storageMessage(){
q("#save-status").hidden=false;
q("#save-status").textContent=
"Picks could not be saved on this device. They will last for this session only.";
}

function loadFavoriteIds(key){
try{
const stored=JSON.parse(localStorage.getItem(key)||"[]");
return Array.isArray(stored)
?[...new Set(stored.filter(id=>sport==="nfl"
?typeof id==="string"&&/^\d+$/.test(id)
:Number.isInteger(id)))]:[];
}catch(error){return [];}
}
favorites=loadFavoriteIds(favoritesKey);
favoriteTeams=loadFavoriteIds(favoriteTeamsKey);

try{
const saved=JSON.parse(localStorage.getItem(storageKey)||"[]");
if(Array.isArray(saved)){
picks=saved.filter(p=>
(sport==="nfl"
?typeof p.id==="string"&&/^\d+$/.test(p.id)
:Number.isInteger(p.id))&&typeof p.name==="string"&&
cats.includes(p.stat)&&["Over","Under"].includes(p.side)&&
Number.isFinite(p.average));
}
}catch(error){storageMessage();}

function save(){
try{localStorage.setItem(storageKey,JSON.stringify(picks));}
catch(error){storageMessage();}
}

function saveFavoriteIds(key,ids,label){
try{localStorage.setItem(key,JSON.stringify(ids));}
catch(error){
q("#save-status").hidden=false;
q("#save-status").textContent=
label+" could not be saved on this device; they will last for this session only.";
}
}

function val(log,key){
const combinations={
PR:["PTS","REB"],PA:["PTS","AST"],RA:["REB","AST"],
PRA:["PTS","REB","AST"]
};
const fields=combinations[key]||[key];
return fields.every(f=>typeof log[f]==="number"&&Number.isFinite(log[f]))
?fields.reduce((sum,f)=>sum+log[f],0):null;
}

function avg(player,key){
const values=player.logs.map(log=>val(log,key)).filter(v=>v!==null);
return values.length?values.reduce((a,b)=>a+b,0)/values.length:null;
}
const fmt=v=>v===null?"—":v.toFixed(1);

function teamCode(value){
const code=String(value||"").toUpperCase();
return ({
GS:"GSW",NY:"NYK",SA:"SAS",NO:"NOP",UTAH:"UTA",WSH:"WAS"
})[code]||code;
}

function opponentLogo(value){
const code=teamCode(value);
if(sport==="nfl"){
return "https://a.espncdn.com/i/teamlogos/nfl/500/"+
encodeURIComponent(code.toLowerCase())+".png";
}
const slug=({
GSW:"gs",NYK:"ny",SAS:"sa",NOP:"no",UTA:"utah",WAS:"wsh"
})[code]||code.toLowerCase();
return "https://a.espncdn.com/i/teamlogos/nba/500/"+
encodeURIComponent(slug)+".png";
}

function opponentFor(player){
const matchup=data.games.find(g=>String(g.id)===game);
if(!matchup)return null;
if(player.team_id===matchup.home_id)return matchup.away;
if(player.team_id===matchup.away_id)return matchup.home;
return null;
}

function chosen(player,key){
const opponent=opponentFor(player);
const pool=venue==="Head-to-Head"
?[...player.logs,...(player.h2h_logs||[])]:player.logs;
const unique=[...new Map(pool.map(log=>[String(log.id),log])).values()];
return unique.filter(log=>{
if(val(log,key)===null)return false;
if(venue==="Head-to-Head"){
return opponent!==null&&teamCode(log.opp)===teamCode(opponent);
}
return venue==="All"||log.home===(venue==="Home");
}).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,n);
}

const matches=player=>
player.name.toLowerCase().includes(search.trim().toLowerCase());
const selected=(id,side)=>picks.some(p=>
p.id===id&&p.stat===stat&&p.side===side);

function favoriteButton(player){
const active=favorites.includes(player.id);
return `<button type="button" class="favorite-star player-favorite-star"
data-favorite="${player.id}" aria-pressed="${active}"
aria-label="${active?"Remove ":"Add "}${esc(player.name)} ${active?"from":"to"} favorites"
>${active?"★":"☆"}</button>`;
}

function favoriteTeamButton(id,name){
const active=favoriteTeams.includes(id);
return `<button type="button" class="favorite-star"
data-favorite-team="${id}" aria-pressed="${active}"
aria-label="${active?"Remove ":"Add "}${esc(name)} ${active?"from":"to"} favorite teams"
>${active?"★":"☆"}</button>`;
}

function scheduledFavoriteTeams(){
const teams=new Map();
for(const matchup of data.games){
for(const [id,abbreviation] of [
[matchup.away_id,matchup.away],[matchup.home_id,matchup.home]
]){
if(!favoriteTeams.includes(id))continue;
if(!teams.has(id))teams.set(id,{id,abbreviation,matchups:[]});
teams.get(id).matchups.push(matchup);
}
}
return [...teams.values()];
}

function availabilityFor(player,gameId=game){
return player.availability?.[String(gameId)]||{};
}

function eligible(player,gameId=game){
if(sport==="nfl"){
const info=availabilityFor(player,gameId);
return Boolean(info.checked_at)&&info.is_available!==false&&
!["out","doubtful","injured reserve","suspended","pup","nfi","practice squad"]
.some(status=>[info.injury_status,info.roster_status]
.some(value=>String(value||"").toLowerCase()===status));
}
const status=String(
availabilityFor(player,gameId).injury_status||""
).trim().toLowerCase();
return !["out","doubtful"].includes(status);
}

function starterRank(player,gameId=game){
const info=availabilityFor(player,gameId);
if(info.is_starter!==true)return 2;
if(info.starter_source==="confirmed")return 0;
if(info.starter_source==="projected")return 1;
return 2;
}

function playerOrder(a,b,gameId=game){
return starterRank(a,gameId)-starterRank(b,gameId)||
a.name.localeCompare(b.name);
}

function lineupLabel(player,gameId=game){
const rank=starterRank(player,gameId);
return rank<2
?`<span class="muted green" style="display:block;margin-bottom:5px">${
rank===0?"Starter":"Projected starter"
}</span>`:"";
}

function identity(player,showFavorite=false){
player={...player,...(data.players.find(p=>p.id===player.id)||{})};

function trend(player,key=stat){
const a=avg(player,key);
const games=player.logs.filter(g=>val(g,key)!==null).slice(0,n);
if(a===null)return '<span class="muted">No saved history</span>';
const above=games.filter(g=>val(g,key)>a+1e-9).length;
const below=games.filter(g=>val(g,key)<a-1e-9).length;
if(above===below){
return `<span class="muted">Above / Below tied · ${above}/${games.length} each</span>`;
}
return `<span class="${above>below?"green":"red"}">
${above>below?"Above":"Below"} ${Math.max(above,below)}/${games.length}
</span>`;
}

function playerCats(player){
if(sport==="nba")return cats;
return cats.filter(key=>player.logs.some(log=>val(log,key)!==null));
}

function primaryStat(player){
if(sport==="nba")return stat;
const available=playerCats(player);
if(available.includes(stat))return stat;
const defaults={
QB:"PASS_YDS",RB:"RUSH_YDS",FB:"RUSH_YDS",
WR:"REC_YDS",TE:"REC_YDS",K:"FGM",PK:"FGM"
};
const preferred=defaults[player.position];
return available.includes(preferred)
?preferred:(available[0]||"PASS_YDS");
}

function playerSummary(player){
if(sport==="nba"){
return `PTS ${fmt(avg(player,"PTS"))} · REB ${fmt(avg(player,"REB"))} · AST ${fmt(avg(player,"AST"))}`;
}
const defaults={
QB:["PASS_YDS","PASS_TD","RUSH_YDS"],
RB:["RUSH_YDS","RUSH_ATT","REC"],
FB:["RUSH_YDS","REC"],
WR:["REC_YDS","REC","TGTS"],
TE:["REC_YDS","REC","TGTS"],
K:["FGM","XPM"],PK:["FGM","XPM"]
};
return (defaults[player.position]||["TACKLES","SACKS","DEF_INT"])
.filter(key=>avg(player,key)!==null)
.map(key=>`${esc(label(key))} ${fmt(avg(player,key))}`).join(" · ");
}

function nflChart(player){
const games=chosen(player,stat).slice().reverse();
if(!games.length){
return '<p class="muted">No saved games for this selection.</p>';
}
const average=avg(player,stat);
const values=games.map(log=>val(log,stat));
const low=Math.min(0,...values,average??0);
const high=Math.max(1,...values,average??0);
const span=high-low;
const bottom=low<0?low-span*.12:0;
const top=high+span*.2;
const range=top-bottom;
const position=value=>100*(value-bottom)/range;
return `<div class="plot" role="group"
aria-label="${esc(label(stat))}; select a bar for its box score.">
<div class="nfl-bars">
<div class="nfl-zero" style="bottom:${position(0)}%"></div>
${games.map(log=>{
const value=val(log,stat);
const color=value>average+1e-9?"#97ff42"
:value<average-1e-9?"#ff667e":"#efd16a";
return `<div class="column">
<button class="box-hit" data-box="${player.id}:${esc(log.id)}"
aria-label="${esc(player.name)}, ${esc(log.date)}, ${esc(log.opp)}, ${value} ${esc(label(stat))}"></button>
<div class="bar" style="position:absolute;
bottom:${position(Math.min(0,value))}%;
height:${100*Math.abs(value)/range}%;
background:${color}">
<span class="number">${value}</span></div>
<span class="opponent">
<img class="opponent-logo" src="${opponentLogo(log.opp)}"
alt="${esc(log.opp)}" loading="lazy">
<span class="logo-fallback" hidden>${esc(log.opp)}</span>
<span class="game-date">${gameDate(log.date)}</span>
</span></div>`;
}).join("")}
${average!==null?`<div class="nfl-mean"
style="bottom:${position(average)}%">
<span>AVG ${fmt(average)}</span></div>`:""}
</div></div>
<p class="muted">
Green: above · Red: below · Yellow: equal · White: season average
</p>`;
}

function matchupLabel(log){
return log.away_team&&log.home_team
?log.away_team+" @ "+log.home_team
:(log.home?"Home vs ":"Away at ")+log.opp;
}

function showBox(player,log){
const number=v=>Number.isFinite(v)?String(v):"—";
const pair=(made,attempted)=>number(made)+" / "+number(attempted);
const rows=sport==="nfl"
?Object.entries(nflLabels)
.filter(([key])=>Number.isFinite(log[key]))
.map(([key,title])=>[title,number(log[key])])
:[
["Minutes",Number.isFinite(log.MIN)?log.MIN.toFixed(1):"—"],
["Points",number(log.PTS)],["Rebounds",number(log.REB)],
["Assists",number(log.AST)],
["3PT made / attempted",pair(log["3PM"],log["3PA"])],
["Steals",number(log.STL)],["Blocks",number(log.BLK)],
["Turnovers",number(log.TOV)],
["FG made / attempted",pair(log.FGM,log.FGA)],
["FT made / attempted",pair(log.FTM,log.FTA)],
["Personal fouls",number(log.PF)],
["Offensive rebounds",number(log.OREB)],
["Defensive rebounds",number(log.DREB)]
];
q("#box-title").textContent=player.name+" · Box Score";
q("#box-content").innerHTML=identity(player)+`
<p class="muted">${esc(log.date)} · ${esc(matchupLabel(log))}</p>
<table class="box-table">
<thead><tr><th scope="col">Stat</th>
<th scope="col" style="text-align:right">Total</th></tr></thead>
<tbody>${rows.map(([label,value])=>
`<tr><th scope="row">${label}</th><td>${value}</td></tr>`
).join("")}</tbody>
</table><p class="muted">— means unavailable in the saved data.</p>`;
q("#box-dialog").showModal();
}

function gameDate(value){
const match=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(value||""));
return match?`${Number(match[2])}/${Number(match[3])}`:"";
}

function chart(player){
if(sport==="nfl")return nflChart(player);
const key=minutes?"MIN":stat;
const a=avg(player,key);
const games=chosen(player,key).slice().reverse();
if(!games.length){
return `<p class="muted">${
venue==="Head-to-Head"
?"No saved head-to-head games against "+esc(opponentFor(player)||"this opponent")+"."
:"No saved games for this selection."
}</p>`;
}
const max=Math.max(1,a,...games.map(g=>
key==="3PM"?Math.max(g["3PA"]??0,g[key]):val(g,key)))*1.2;
const bars=games.map(log=>{
const v=val(log,key);
const attempts=key==="3PM"&&Number.isFinite(log["3PA"])
?`<div style="position:absolute;bottom:0;width:100%;
height:${100*log["3PA"]/max}%;background:#596982;">
<span class="number" style="color:#bbc8dd">${log["3PA"]}</span>
</div>`:"";
const color=v>a+1e-9?"#97ff42":v<a-1e-9?"#ff667e":"#efd16a";
return `<div class="column">
<button class="box-hit" data-box="${player.id}:${esc(log.id)}"
aria-label="${esc(player.name)} game box score, ${esc(log.date)}, ${esc(log.opp)}, ${v} ${esc(key)}"></button>
${attempts}
<div class="bar" style="height:${100*v/max}%;
${key==="3PM"?"width:62%;margin:auto auto 0;":""}
background:${color};"><span class="number">${v}</span></div>
<span class="opponent">
<img class="opponent-logo" src="${opponentLogo(log.opp)}"
alt="${esc(teamCode(log.opp))}" loading="lazy">
<span class="logo-fallback" hidden>${esc(teamCode(log.opp))}</span>
<span class="game-date">${gameDate(log.date)}</span>
</span></div>`;
}).join("");
return `<div class="plot" role="group"
aria-label="Recent ${esc(key)}. Select a bar for its game box score.">
<div class="bars">${bars}</div>
<div class="average"
style="--average-ratio:${a/max};bottom:calc(58px + 155px * ${a/max});">
<span>AVG ${fmt(a)}</span></div></div>
<p class="muted">
${key==="3PM"?"Muted background: attempted · Colored bar: made<br>":""}
Green: above · Red: below · Yellow: equal · White: season average
</p>
${key==="3PM"&&games.some(g=>g["3PA"]===null)
?'<p class="muted">Attempts unavailable for some games; no attempts bar is shown for those games.</p>':""}`;
}

function headToHeadTable(player,games,key){
if(venue!=="Head-to-Head"||!games.length)return "";
return `<div style="overflow-x:auto"><table class="box-table">
<thead><tr><th scope="col">Date</th><th scope="col">Game</th>
<th scope="col">${esc(key)}</th><th scope="col">Box score</th>
</tr></thead><tbody>
${games.map(log=>`<tr>
<th scope="row">${esc(log.date)}</th>
<td>${esc(matchupLabel(log))}</td><td>${val(log,key)}</td>
<td><button data-box="${player.id}:${esc(log.id)}">View</button></td>
</tr>`).join("")}
</tbody></table></div>`;
}

stat=primaryStat(player);
}
const key=minutes?"MIN":stat;
const games=chosen(player,key);
const a=avg(player,stat);
const recent=games.length
?fmt(games.reduce((s,g)=>s+val(g,key),0)/games.length):"—";
return `<section data-player="${player.id}">
<div>
<span class="player-heading">${identity(player,true)}</span>
${lineupLabel(player)}
<span class="muted">${playerSummary(player)}</span>
</div>
<div class="row player-stat-tabs" style="margin-top:12px">
${playerCats(player).map(k=>`<button data-stat="${k}"
aria-pressed="${stat===k}">${esc(label(k))}</button>`).join("")}
</div>
${sport==="nba"?`<div class="player-graph-mode"
style="text-align:right;margin:9px 0">
<button data-minutes>${minutes?"Stat Graph":"Minutes Graph"}</button>
</div>`:""}
<div class="row player-venue" style="justify-content:flex-end;margin:9px 0">
${["All","Home","Away","Head-to-Head"].map(v=>
`<button data-venue="${v}" aria-pressed="${venue===v}"
${v==="Head-to-Head"&&!opponentFor(player)?"disabled":""}>${v}</button>`
).join("")}
</div>
${venue==="Head-to-Head"?`<p class="muted">
Against ${esc(opponentFor(player)||"the selected opponent")} ·
${esc(data.h2h_seasons||"current and previous season")}.
Most recent saved meetings; season average stays current-season only.
</p>`:""}
<h3>Performance${sport==="nfl"?` · ${esc(label(key))}`:""}</h3>
<div class="row"><span class="muted">Last</span>
${[5,10,20].map(v=>`<button data-window="${v}"
aria-pressed="${n===v}">${v}</button>`).join("")}
</div>
<div class="metrics">
<div class="metric"><span class="muted">Season average</span>
<strong>${fmt(avg(player,key))}</strong></div>
<div class="metric"><span class="muted">Last ${n} average</span>
<strong>${recent}</strong></div>
<div class="metric"><span class="muted">Games</span>
<strong>${games.length}</strong></div>
</div>
${chart(player)}${headToHeadTable(player,games,key)}
<h3>Add to My Picks</h3>
<div class="actions">
${["Over","Under"].map(side=>
`<button data-pick="${player.id}:${side}"
aria-pressed="${selected(player.id,side)}" ${a===null?"disabled":""}>
${selected(player.id,side)?"✓ ":""}${side}</button>`).join("")}

function playerCard(player){
return `<div class="player-card player-action-area">
<button type="button" class="player-action-overlay"
data-player-open="${player.id}"
aria-haspopup="dialog" aria-label="Open ${esc(player.name)} stats"></button>
<div class="player-open">
${identity(player,true)}${lineupLabel(player)}

function renderPlayerPopup(){
if(activePlayer===null)return;
const player=data.players.find(p=>p.id===activePlayer);
if(!player)return;
const panel=q("#player-dialog-content");
const scrollTop=q("#player-dialog").scrollTop;
const focused=document.activeElement;
const focusKey=focused&&panel.contains(focused)
?Array.from(focused.attributes).find(a=>a.name.startsWith("data-")):null;
q("#player-dialog-title").textContent=player.name+" · Stats";
panel.innerHTML=detail(player);
if(!q("#player-dialog").open)q("#player-dialog").showModal();
if(focusKey){
const target=Array.from(panel.querySelectorAll("button")).find(b=>
b.getAttribute(focusKey.name)===focusKey.value);
if(target)target.focus({preventScroll:true});
}
q("#player-dialog").scrollTop=scrollTop;
}

function teamCards(matchup,onlyId){
const number=value=>Number.isFinite(value)?value.toFixed(1):"—";
const percent=value=>Number.isFinite(value)?value.toFixed(1)+"%":"—";

const shown=[
[matchup.away_id,matchup.away,"Away"],
[matchup.home_id,matchup.home,"Home"]
].filter(([id,abbreviation])=>
(onlyId===undefined||id===onlyId)&&
(team==="All"||teamCode(team)===teamCode(abbreviation)));

const rows=sport==="nfl"
?[
["Points per game","points","points_allowed",false],
["Rush yards per game","rushing_yards","rushing_yards_allowed",false],
["Receiving yards per game","receiving_yards","receiving_yards_allowed",false],
["FG made/attempts","field_goals_made","field_goals_allowed",false,"field_goals_attempted","field_goal_attempts_allowed"]
]
:[
["Points per game","points","points_allowed",false],
["Assists per game","assists","assists_allowed",false],
["Rebounds per game","rebounds","rebounds_allowed",false],
["3-pointers per game","threes_made","threes_allowed",false],
["Turnovers per game","turnovers","turnovers_forced",false],
["FG%","fg_pct","fg_pct_allowed",true],
["3PT%","three_pct","three_pct_allowed",true],
["FT%","ft_pct",null,true]
];

const cell=(t,key,isPercent,attemptKey,colspan=1)=>{
const value=attemptKey
?number(t?.[key])+" / "+number(t?.[attemptKey])
:(isPercent?percent:number)(t?.[key]);
const count=t?.metric_games?.[key];
const coverage=Number.isInteger(count)&&t
?`${count}/${t.games} saved final games`
:"Available saved final games";
return `<td colspan="${colspan}"
aria-label="${esc(coverage)}: ${esc(value)}">${value}</td>`;
};

return `<section class="team-comparison-panel"
aria-label="Team statistics for and allowed">
<table class="team-comparison ${shown.length===1?"one-team":""}">
<colgroup><col class="stat-label-col"></colgroup>
${shown.map(()=>"<colgroup><col><col></colgroup>").join("")}
<thead>
<tr>
<th rowspan="3" scope="col" class="stat-label">Stat</th>
${shown.map(([id,abbreviation,location])=>{
const t=data.team_stats?.[String(id)];
return `<th colspan="2" scope="colgroup">
<div class="comparison-team-name">
<span>${esc(abbreviation)}</span>
${favoriteTeamButton(id,t?.name||abbreviation)}
</div>
<span class="muted">${esc(t?.name||abbreviation)} · ${location}</span>
</th>`;
}).join("")}
</tr>
<tr>
${shown.map(([id])=>{
const t=data.team_stats?.[String(id)];
return `<th colspan="2" class="comparison-record">
Record ${t?`${t.wins}–${t.losses}${sport==="nfl"?`–${t.ties||0}`:""}`:"—"}
</th>`;
}).join("")}
</tr>
<tr>
${shown.map(()=>
'<th scope="col">For</th><th scope="col">Against</th>'
).join("")}
</tr>
</thead>
<tbody>
${rows.map(([label,own,allowed,isPercent,ownAttempts,allowedAttempts])=>`
<tr>
<th scope="row">${label}</th>
${shown.map(([id])=>{
const t=data.team_stats?.[String(id)];
return allowed===null
?cell(t,own,isPercent,undefined,2)
:cell(t,own,isPercent,ownAttempts)+
cell(t,allowed,isPercent,allowedAttempts);
}).join("")}
</tr>`).join("")}
</tbody>
</table>
<p class="muted comparison-note">
${esc(data.season)} · Saved final games only.
</p>
</section>`;
}

<div class="row">
${["All",g.away,g.home].map(t=>

${team==="All"

${[[g.away_id,g.away],[g.home_id,g.home]].map(([id,abbreviation])=>
`<section class="team-column"
aria-label="${esc(abbreviation)} team stats and players">
${data.players.filter(p=>
p.team_id===id&&matches(p)&&eligible(p,g.id)&&

if(action.sport){
if(action.sport!==sport){
const url=new URL(location.href);
url.searchParams.set("sport",action.sport);
location.assign(url.href);
}
return;
}

if("closePlayer" in action){
q("#player-dialog").close();
return;
}

if(action.playerOpen!==undefined){
activePlayer=toId(action.playerOpen);
renderPlayerPopup();
return;
}

if(action.favoriteTeam!==undefined){
event.preventDefault();
const id=toId(action.favoriteTeam);
const index=favoriteTeams.indexOf(id);
if(index<0)favoriteTeams.push(id);
else favoriteTeams.splice(index,1);
saveFavoriteIds(favoriteTeamsKey,favoriteTeams,"Favorite teams");
render(open);
return;
}

if(action.favoriteTeamOpen!==undefined){
const matchup=data.games.find(g=>String(g.id)===action.match);
const id=toId(action.favoriteTeamOpen);
if(!matchup||![matchup.home_id,matchup.away_id].includes(id))return;
game=String(matchup.id);
team=id===matchup.home_id?matchup.home:matchup.away;
venue="All";
search="";
q("#search").value="";
myPicks=false;
render();
q("#content").scrollIntoView({block:"start"});
return;
}

if(action.favorite!==undefined){
event.preventDefault();
const id=toId(action.favorite);
const index=favorites.indexOf(id);
if(index<0)favorites.push(id);
else favorites.splice(index,1);
saveFavoriteIds(favoritesKey,favorites,"Favorite players");
render(open);
return;
}

if(action.favoriteOpen!==undefined){
game=action.match;
team="All";
venue="All";
search="";
q("#search").value="";
myPicks=false;
render(action.favoriteOpen);
return;
}

if(action.box){
const [id,gameId]=action.box.split(":");
const player=data.players.find(p=>p.id===toId(id));
const log=player&&[
...player.logs,...(player.h2h_logs||[])
].find(log=>String(log.id)===gameId);
if(log)showBox(player,log);
return;
}

if("closeBox" in action){
q("#box-dialog").close();
return;
}

if(button.id==="picks"){
myPicks=!myPicks;
render();
}else if(action.game){
game=action.game;
team="All";
venue="All";
myPicks=false;
render();
}else if(action.open){
game=action.match;
team="All";
render(action.open);
}else if(action.team){
team=action.team;
render();
}else if(action.stat){
stat=action.stat;
render(open);
}else if(action.window){
n=Number(action.window);
render(open);
}else if("minutes" in action){
minutes=!minutes;
render(open);
}else if(action.venue){
venue=action.venue;
render(open);
}else if(action.pick){
const [id,side]=action.pick.split(":");
const player=data.players.find(p=>p.id===toId(id));
if(!player)return;
const existing=picks.findIndex(p=>
p.id===toId(id)&&p.stat===stat&&p.side===side);
if(existing<0){
picks.push({
id:player.id,name:player.name,team:player.team,
position:player.position,height:player.height,weight:player.weight,
stat,side,average:avg(player,stat),
saved_at:new Date().toISOString()
});
}else{picks.splice(existing,1);}
save();
render(open);
}else if(action.remove!==undefined){
picks.splice(Number(action.remove),1);
save();
render();
}
});

q("main").addEventListener("error",event=>{
const image=event.target;
if(image instanceof HTMLImageElement&&
image.classList.contains("opponent-logo")){
image.hidden=true;
if(image.nextElementSibling)image.nextElementSibling.hidden=false;
}
},true);

q("#player-dialog").addEventListener("close",()=>{
activePlayer=null;
q("#player-dialog-content").innerHTML="";
});

q("#search").addEventListener("input",event=>{
search=event.target.value;
render();
});

async function load(){
try{
const response=await fetch(
sport==="nfl"?"/api/nfl/dashboard":"/api/dashboard",
{cache:"no-store"}
);
const result=await response.json();
if(!response.ok)throw Error(result.error);
data=result;
q("#games-title").textContent=sport==="nfl"
?`NFL · Week ${result.week??"—"}`:"Today's Games";
q("#favorites").setAttribute(
"aria-label",
sport==="nfl"
?"Favorite players and teams scheduled this week"
:"Favorite players and teams scheduled today"
);
q("#status").textContent=
`${result.date} · ${result.season} · Saved game statistics`+
(result.updated_at
?" · Data updated "+new Date(result.updated_at).toLocaleString():"");
render();
}catch(error){
q("#status").textContent=navigator.onLine
?`Saved ${sport.toUpperCase()} data could not load. Reload to try again.`
:`Offline · Reconnect to load current ${sport.toUpperCase()} stats.`;
render();
}
}

q("#status").textContent=`Loading saved ${sport.toUpperCase()} data…`;
render();
load();
if("serviceWorker" in navigator){
navigator.serviceWorker.register("/service-worker.js").catch(()=>{});
}
})();
</script>
</body>
</html>
