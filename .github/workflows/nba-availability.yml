name: NBA Injuries and Starters

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: nba-availability
  cancel-in-progress: false

jobs:
  sync:
    name: Update injuries and starting lineups
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install database driver
        run: python -m pip install "psycopg[binary]==3.2.10"

      - name: Collect injuries and starters
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collector/sync_availability.py
