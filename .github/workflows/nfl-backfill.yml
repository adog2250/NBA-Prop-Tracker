name: NFL Full Season Backfill

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-roster-sync
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install database dependency
        run: python -m pip install "psycopg[binary]>=3.2,<4"

      - name: Refresh current NFL rosters
        run: python collector/sync_nfl_rosters.py

      - name: Refresh full NFL schedule
        run: python collector/sync_nfl_games.py

      - name: Import every completed NFL game
        run: python collector/backfill_nfl_season.py

      - name: Refresh injuries
        run: python collector/sync_nfl_availability.py

      - name: Refresh projected starters
        run: python collector/sync_nfl_starters.py
