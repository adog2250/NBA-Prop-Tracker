
name: NBA Full Season Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"

permissions:
  contents: read

concurrency:
  group: nba-season-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill all NBA season games
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install database driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary]==3.2.10"

      - name: Find and run NBA season backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          echo "Searching for backfill_season.py..."

          SCRIPT="$(find . -type f -name 'backfill_season.py' -not -path './.git/*' -print -quit)"

          if [ -z "$SCRIPT" ]; then
            echo "::error::backfill_season.py was not found anywhere in the repository."
            echo "Repository files:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Found script: $SCRIPT"
          python "$SCRIPT"
