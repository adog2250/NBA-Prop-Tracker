name: NBA Team Stats

on:
  workflow_dispatch:
    inputs:
      full_season:
        description: Recheck every saved final game this season
        required: false
        type: boolean
        default: true

  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: nba-team-stats
  cancel-in-progress: false

jobs:
  sync:
    name: Update complete team box scores
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install database driver
        run: python -m pip install "psycopg[binary]==3.2.10"

      - name: Collect team stats
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FULL_SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.full_season || false }}
        run: |
          if [ "$FULL_SEASON" = "true" ]; then
            python collector/sync_team_stats.py --full-season
          else
            python collector/sync_team_stats.py
          fi
