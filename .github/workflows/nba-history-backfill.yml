name: NBA Historical Games Import

on:
  workflow_dispatch:
    inputs:
      season_start:
        description: "Season starting year: 2025 imports 2025-26"
        required: true
        default: "2025"
        type: choice
        options:
          - "2025"
          - "2024"

permissions:
  contents: read

concurrency:
  group: nba-history-import
  cancel-in-progress: false

jobs:
  import:
    name: Import month ${{ matrix.month }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        month: [10, 11, 12, 1, 2, 3, 4, 5, 6]

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install database driver
        run: python -m pip install "psycopg[binary]==3.2.10"

      - name: Import historical box scores
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEASON_START: ${{ inputs.season_start }}
          IMPORT_MONTH: ${{ matrix.month }}
        run: |
          python collector/backfill_history.py \
            --season-start "$SEASON_START" \
            --month "$IMPORT_MONTH"
